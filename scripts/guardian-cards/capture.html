<!DOCTYPE html>
<html>
<head><meta charset="UTF-8"><style>html,body{margin:0;background:#000;overflow:hidden}#player{width:1280px;height:720px}</style></head>
<body>
<div id="player"></div>
<script>
  const tag = document.createElement('script')
  tag.src = 'https://www.youtube.com/iframe_api'
  document.head.appendChild(tag)
  window.playerReady = false
  window.onYouTubeIframeAPIReady = () => {
    window.player = new YT.Player('player', {
      width: 1280, height: 720,
      videoId: new URLSearchParams(location.search).get('v') || 'BV3BZKbpBns',
      playerVars: { controls: 0, disablekb: 1, rel: 0, modestbranding: 1, iv_load_policy: 3, playsinline: 1 },
      events: {
        onReady: (event) => {
          event.target.mute()
          window.playerReady = true
        },
      },
    })
  }
  window.seekAndPlay = (t) => {
    window.player.seekTo(t, true)
    window.player.playVideo()
  }
  window.currentTime = () => window.player.getCurrentTime()
  window.playerState = () => window.player.getPlayerState()
</script>
</body>
</html>
